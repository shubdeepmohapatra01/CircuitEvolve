# Dependency declaration only -- this repo is a set of scripts, not an installable package.
#   python3.11 -m venv .venv && .venv/bin/pip install -e .      (or: pip install -r requirements.txt)
# The BQSKit DPF baseline (pipeline.bqskit_dpf) additionally needs the bqskit-ft package, which is not on PyPI:
#   pip install --no-deps "bqskit-ft @ git+https://github.com/BQSKit/bqskit-ft@2e99ba614d48970b9afefc0b8c32860c3a3dc9f1"
# It is pure Python and needs no dependency beyond the ones below; see baselines/dpf/pip_freeze_dpf.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitevolve"
version = "0.2.0"
description = "A verifier-first harness that puts an LLM coding agent inside a Clifford+T circuit-optimization loop"
requires-python = ">=3.11"
# Kept in step with requirements.txt, which carries the same list with notes.
dependencies = [
    "qiskit==2.5.2",       # circuits, QASM 2 I/O, Operator (the no-ancilla verifier)
    "pytket==2.18.5",      # TKET FullPeepholeOptimise baseline
    "pyzx==0.10.7",        # ZX full_reduce baseline
    "pygridsynth==2.0.0",  # rz -> Clifford+T synthesis, the T-count metric
    "mpmath>=1.3",         # gridsynth works at 128 decimal digits
    "numpy>=1.26",
    "scipy>=1.11",         # not used by the harness; the agent's technique.py scripts may import it
    "matplotlib>=3.8",     # draw.py figures
]

[tool.setuptools]
# Only the root modules; the scripts in verifier/, sweep/, tests/, baselines/ and campaign/ put what they need on
# sys.path themselves, so they run from the repo root without an install.
py-modules = ["pipeline", "playbook", "agent", "draw"]
